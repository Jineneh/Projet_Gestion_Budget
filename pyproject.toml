[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-perso"
version = "0.1.0"
description = "Application en ligne de commande de gestion de budget personnel"
requires-python = ">=3.11"

[project.scripts]
budget = "budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8